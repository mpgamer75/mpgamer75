  <g class="row" style="animation-delay:0.9s">
    <text class="mono muted" x="52" y="757" font-size="15" letter-spacing="2">WORKS ON</text>
    <text class="sans ink" x="52" y="787" font-size="23">Recon, applied crypto, SOC tooling</text>
    <path class="rule" d="M34 805.5H606" stroke-opacity=".7"/>
  </g>
  <g class="row" style="animation-delay:1s">
    <text class="mono muted" x="52" y="835" font-size="15" letter-spacing="2">SHIPS WITH</text>
    <text class="sans ink" x="52" y="865" font-size="23">Bash, Python, Next.js, Flutter</text>
    <path class="rule" d="M34 883.5H606" stroke-opacity=".7"/>
  </g>
  <g class="row" style="animation-delay:1.1s">
    <text class="mono muted" x="52" y="913" font-size="15" letter-spacing="2">SPEAKS</text>
    <text class="sans ink" x="52" y="943" font-size="23">English, French, Spanish</text>
    <path class="rule" d="M34 961.5H606" stroke-opacity=".7"/>
  </g>
