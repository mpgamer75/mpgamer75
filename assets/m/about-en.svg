<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 991" width="640" height="991" role="img" aria-labelledby="t d">
  <title id="t">ABOUT</title>
  <desc id="d">I build software, and the tools that test it. Most of what is public here is security tooling for the terminal: a recon framework mapped to MITRE ATT&amp;CK, an authenticated encryption toolkit on top of OpenSSL, and the automation I wrote for a SOC team. Alongside it I ship web and mobile products, and I co-founded Lanjo Technologies. ROLE: Cybersecurity and software engineer. COMPANY: Lanjo Technologies, co-founder. BASED IN: Paris, France. WORKS ON: Recon, applied crypto, SOC tooling. SHIPS WITH: Bash, Python, Next.js, Flutter. SPEAKS: English, French, Spanish.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .ink { fill: #f3efe8; } .soft { fill: #b9b3a8; } .muted { fill: #7d786f; }
    .amber { fill: #f0a23b; } .hot { fill: #ffcf85; } .faint { fill: #24262c; }
    .rule { stroke: #24262c; fill: none; }
    .sa { stroke: #f0a23b; fill: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes nudge { 50% { transform: translate(3px, -3px); } }
    .in { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .row { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
    .bar { transform-box: fill-box; transform-origin: 50% 0; animation: barin 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .hl { animation: hl 9.600000000000001s steps(6) 1.4s infinite both; }
    @keyframes barin { from { transform: scaleY(0); } }
    @keyframes hl { from { transform: translateY(0); } to { transform: translateY(468px); } }
    @media (prefers-reduced-motion: reduce) { .hl { display: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#f0a23b" stop-opacity=".16"/><stop offset="1" stop-color="#f0a23b" stop-opacity="0"/></linearGradient>
    <linearGradient id="wipe" x1="0" x2="1"><stop offset="0" stop-color="#f0a23b"/><stop offset="1" stop-color="#ffcf85"/></linearGradient>
  </defs>
  <rect x=".5" y=".5" width="639" height="990" rx="16" fill="#0a0b0e" stroke="#24262c"/>
  <rect class="amber bar" x="34" y="86" width="3" height="369"/>
  <text class="mono amber in" x="58" y="100" font-size="16" letter-spacing="3">ABOUT</text>
  <text class="sans ink in" style="animation-delay:.15s" x="56" y="154" font-size="39" font-weight="700" letter-spacing="-1">I build software,</text>
  <text class="sans in" style="animation-delay:.3s" x="56" y="202" font-size="39" font-weight="700" letter-spacing="-1" fill="url(#wipe)">and the tools that test it.</text>
  <text class="sans soft in" style="animation-delay:0.5s" x="58" y="236" font-size="23">Most of what is public here is security</text>
  <text class="sans soft in" style="animation-delay:0.5s" x="58" y="269" font-size="23">tooling for the terminal: a recon framework</text>
  <text class="sans soft in" style="animation-delay:0.6s" x="58" y="302" font-size="23">mapped to MITRE ATT&amp;CK, an authenticated</text>
  <text class="sans soft in" style="animation-delay:0.7s" x="58" y="335" font-size="23">encryption toolkit on top of OpenSSL, and</text>
  <text class="sans soft in" style="animation-delay:0.7s" x="58" y="368" font-size="23">the automation I wrote for a SOC team.</text>
  <text class="sans soft in" style="animation-delay:0.8s" x="58" y="401" font-size="23">Alongside it I ship web and mobile products,</text>
  <text class="sans soft in" style="animation-delay:0.9s" x="58" y="434" font-size="23">and I co-founded Lanjo Technologies.</text>
  <path class="rule" d="M34 493.5H606" stroke-opacity=".7"/>
  <g class="hl"><rect x="34" y="494" width="572" height="77" fill="url(#hl)"/><rect class="amber" x="34" y="494" width="3" height="77"/></g>
  <g class="row" style="animation-delay:0.5s">
    <text class="mono muted" x="52" y="523" font-size="15" letter-spacing="2">ROLE</text>
