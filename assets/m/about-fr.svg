<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 1057" width="640" height="1057" role="img" aria-labelledby="t d">
  <title id="t">A PROPOS</title>
  <desc id="d">Je construis des logiciels, et les outils qui les testent. L'essentiel de ce qui est public ici, ce sont des outils de sécurité pour le terminal : un framework de reconnaissance aligné sur MITRE ATT&amp;CK, une boîte à outils de chiffrement authentifié au-dessus d'OpenSSL, et l'automatisation écrite pour une équipe SOC. En parallèle, je livre des produits web et mobiles, et j'ai cofondé Lanjo Technologies. ROLE: Ingénieur cybersécurité et logiciel. ENTREPRISE: Lanjo Technologies, cofondateur. BASE A: Paris, France. TRAVAILLE SUR: Recon, crypto appliquée, outils SOC. LIVRE AVEC: Bash, Python, Next.js, Flutter. LANGUES: Anglais, français, espagnol.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .ink { fill: #f3efe8; } .soft { fill: #b9b3a8; } .muted { fill: #7d786f; }
    .amber { fill: #f0a23b; } .hot { fill: #ffcf85; } .faint { fill: #24262c; }
    .rule { stroke: #24262c; fill: none; }
    .sa { stroke: #f0a23b; fill: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes nudge { 50% { transform: translate(3px, -3px); } }
    .in { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .row { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
    .bar { transform-box: fill-box; transform-origin: 50% 0; animation: barin 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .hl { animation: hl 9.600000000000001s steps(6) 1.4s infinite both; }
    @keyframes barin { from { transform: scaleY(0); } }
    @keyframes hl { from { transform: translateY(0); } to { transform: translateY(468px); } }
    @media (prefers-reduced-motion: reduce) { .hl { display: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#f0a23b" stop-opacity=".16"/><stop offset="1" stop-color="#f0a23b" stop-opacity="0"/></linearGradient>
    <linearGradient id="wipe" x1="0" x2="1"><stop offset="0" stop-color="#f0a23b"/><stop offset="1" stop-color="#ffcf85"/></linearGradient>
  </defs>
  <rect x=".5" y=".5" width="639" height="1056" rx="16" fill="#0a0b0e" stroke="#24262c"/>
  <rect class="amber bar" x="34" y="86" width="3" height="435"/>
  <text class="mono amber in" x="58" y="100" font-size="16" letter-spacing="3">A PROPOS</text>
  <text class="sans ink in" style="animation-delay:.15s" x="56" y="154" font-size="39" font-weight="700" letter-spacing="-1">Je construis des logiciels,</text>
  <text class="sans in" style="animation-delay:.3s" x="56" y="202" font-size="39" font-weight="700" letter-spacing="-1" fill="url(#wipe)">et les outils qui les testent.</text>
  <text class="sans soft in" style="animation-delay:0.5s" x="58" y="236" font-size="23">L'essentiel de ce qui est public ici, ce</text>
  <text class="sans soft in" style="animation-delay:0.5s" x="58" y="269" font-size="23">sont des outils de sécurité pour le terminal</text>
  <text class="sans soft in" style="animation-delay:0.6s" x="58" y="302" font-size="23">: un framework de reconnaissance aligné sur</text>
  <text class="sans soft in" style="animation-delay:0.7s" x="58" y="335" font-size="23">MITRE ATT&amp;CK, une boîte à outils de</text>
  <text class="sans soft in" style="animation-delay:0.7s" x="58" y="368" font-size="23">chiffrement authentifié au-dessus d'OpenSSL,</text>
  <text class="sans soft in" style="animation-delay:0.8s" x="58" y="401" font-size="23">et l'automatisation écrite pour une équipe</text>
  <text class="sans soft in" style="animation-delay:0.9s" x="58" y="434" font-size="23">SOC. En parallèle, je livre des produits web</text>
  <text class="sans soft in" style="animation-delay:0.9s" x="58" y="467" font-size="23">et mobiles, et j'ai cofondé Lanjo</text>
  <text class="sans soft in" style="animation-delay:1s" x="58" y="500" font-size="23">Technologies.</text>
  <path class="rule" d="M34 559.5H606" stroke-opacity=".7"/>
  <g class="hl"><rect x="34" y="560" width="572" height="77" fill="url(#hl)"/><rect class="amber" x="34" y="560" width="3" height="77"/></g>
  <g class="row" style="animation-delay:0.5s">
    <text class="mono muted" x="52" y="589" font-size="15" letter-spacing="2">ROLE</text>
    <text class="sans ink" x="52" y="619" font-size="23">Ingénieur cybersécurité et logiciel</text>
    <path class="rule" d="M34 637.5H606" stroke-opacity=".7"/>
  </g>
  <g class="row" style="animation-delay:0.6s">
    <text class="mono muted" x="52" y="667" font-size="15" letter-spacing="2">ENTREPRISE</text>
    <text class="sans ink" x="52" y="697" font-size="23">Lanjo Technologies, cofondateur</text>
    <path class="rule" d="M34 715.5H606" stroke-opacity=".7"/>
  </g>
  <g class="row" style="animation-delay:0.7s">
    <text class="mono muted" x="52" y="745" font-size="15" letter-spacing="2">BASE A</text>
    <text class="sans ink" x="52" y="775" font-size="23">Paris, France</text>
    <path class="rule" d="M34 793.5H606" stroke-opacity=".7"/>
  </g>
  <g class="row" style="animation-delay:0.9s">
    <text class="mono muted" x="52" y="823" font-size="15" letter-spacing="2">TRAVAILLE SUR</text>
    <text class="sans ink" x="52" y="853" font-size="23">Recon, crypto appliquée, outils SOC</text>
    <path class="rule" d="M34 871.5H606" stroke-opacity=".7"/>
  </g>
  <g class="row" style="animation-delay:1s">
    <text class="mono muted" x="52" y="901" font-size="15" letter-spacing="2">LIVRE AVEC</text>
    <text class="sans ink" x="52" y="931" font-size="23">Bash, Python, Next.js, Flutter</text>
    <path class="rule" d="M34 949.5H606" stroke-opacity=".7"/>
  </g>
  <g class="row" style="animation-delay:1.1s">
    <text class="mono muted" x="52" y="979" font-size="15" letter-spacing="2">LANGUES</text>
    <text class="sans ink" x="52" y="1009" font-size="23">Anglais, français, espagnol</text>
