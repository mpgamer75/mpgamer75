<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 646" width="640" height="646" role="img" aria-labelledby="t d">
  <title id="t">Mi SaludRD</title>
  <desc id="d">Digital health platform for the Dominican Republic, built and operated by Lanjo Technologies. Next.js, Flutter, Supabase, Stripe.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .ink { fill: #f3efe8; } .soft { fill: #b9b3a8; } .muted { fill: #7d786f; }
    .amber { fill: #f0a23b; } .hot { fill: #ffcf85; } .faint { fill: #24262c; }
    .rule { stroke: #24262c; fill: none; }
    .sa { stroke: #f0a23b; fill: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes nudge { 50% { transform: translate(3px, -3px); } }
    .arrow { animation: nudge 2.4s ease-in-out infinite; }
    .ecg { stroke-dasharray: .22 .78; animation: ecg 3.2s linear infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite; }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
    @keyframes ecg { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
    @keyframes beat { 0%, 30%, 100% { transform: scale(1); } 12% { transform: scale(1.08); } 22% { transform: scale(.98); } }
    @media (prefers-reduced-motion: reduce) { .ecg { stroke-dasharray: none; } .ring { display: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#24262c"/></pattern>
    <linearGradient id="fadeE" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#0a0b0e"/><stop offset="1" stop-color="#0a0b0e" stop-opacity="0"/></linearGradient>
    <clipPath id="pr"><rect width="640" height="646" rx="16"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="639" height="645" rx="16" fill="#0a0b0e" stroke="#24262c"/>
  <g clip-path="url(#pr)">
    <rect x="0" y="1" width="639" height="248" fill="url(#dots)"/>
    <rect x="0" y="160" width="640" height="90" fill="url(#fadeE)"/>
    <defs><radialGradient id="halo"><stop offset="0" stop-color="#4fd1d9" stop-opacity=".22"/><stop offset="1" stop-color="#4fd1d9" stop-opacity="0"/></radialGradient></defs>
    <circle cx="320" cy="118" r="170" fill="url(#halo)"/>
    <path d="M30 118H130l10 -8 10 8h20l8 16 12 -70 14 96 10 -42h22M402 118h20l8 16 12 -70 14 96 10 -42h22l10 -8 10 8H610" fill="none" stroke="#24262c" stroke-width="1.5" stroke-linejoin="round"/>
    <path class="ecg" pathLength="1" d="M30 118H130l10 -8 10 8h20l8 16 12 -70 14 96 10 -42h22M402 118h20l8 16 12 -70 14 96 10 -42h22l10 -8 10 8H610" fill="none" stroke="#4fd1d9" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="ring" cx="320" cy="118" r="62" fill="none" stroke="#4fd1d9" stroke-width="1.5"/>
    <circle class="ring" style="animation-delay:1.5s" cx="320" cy="118" r="62" fill="none" stroke="#2f7fd6" stroke-width="1.5"/>
    <circle cx="320" cy="118" r="62" fill="#0d1218" stroke="#24262c"/>
    <image class="beat" x="254" y="52" width="132" height="132" xlink:href="data:image/png;base64," href="data:image/png;base64,"/>
    
  </g>
  <rect x=".5" y=".5" width="639" height="645" rx="16" fill="none" stroke="#24262c"/>
  <text class="mono" x="34" y="296" font-size="16" letter-spacing="2" fill="#4fd1d9">PRODUCT  /  LANJO TECHNOLOGIES</text>
  <text class="sans ink" x="32" y="354" font-size="46" font-weight="700" letter-spacing="-1">Mi SaludRD</text>
  <text class="sans soft" x="34" y="400" font-size="23">Lanjo's own product, in beta: a digital</text>
  <text class="sans soft" x="34" y="433" font-size="23">health platform for the Dominican Republic.</text>
  <text class="sans soft" x="34" y="466" font-size="23">Patients book appointments with verified</text>
  <text class="sans soft" x="34" y="499" font-size="23">professionals; doctors get scheduling,</text>
  <text class="sans soft" x="34" y="532" font-size="23">clinical records and modules per specialty.</text>
  <rect x="34" y="571" width="107" height="37" rx="18.5" fill="none" stroke="#24262c"/><text class="mono soft" x="87.5" y="595.5" font-size="17" text-anchor="middle">Next.js</text><rect x="149" y="571" width="107" height="37" rx="18.5" fill="none" stroke="#24262c"/><text class="mono soft" x="202.5" y="595.5" font-size="17" text-anchor="middle">Flutter</text><rect x="264" y="571" width="118" height="37" rx="18.5" fill="none" stroke="#24262c"/><text class="mono soft" x="323" y="595.5" font-size="17" text-anchor="middle">Supabase</text><rect x="390" y="571" width="97" height="37" rx="18.5" fill="none" stroke="#24262c"/><text class="mono soft" x="438.5" y="595.5" font-size="17" text-anchor="middle">Stripe</text>
  <path class="arrow" fill="none" stroke="#4fd1d9" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round" d="M507 600.6L528.6 579M511.8 579H528.6V595.8"/>
