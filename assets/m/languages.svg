<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 464" width="640" height="464" role="img" aria-labelledby="t d">
  <title id="t">Languages across public repositories</title>
  <desc id="d">Share of code by bytes: TypeScript 50.5%, Shell 12.9%, JavaScript 10.2%, PowerShell 9.4%, Dart 6.5%, Python 5.9%.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .ink { fill: #f3efe8; } .soft { fill: #b9b3a8; } .muted { fill: #7d786f; }
    .amber { fill: #f0a23b; } .hot { fill: #ffcf85; } .faint { fill: #24262c; }
    .rule { stroke: #24262c; fill: none; }
    .sa { stroke: #f0a23b; fill: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes nudge { 50% { transform: translate(3px, -3px); } }
    .bar { transform-box: fill-box; transform-origin: 0 50%; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x=".5" y=".5" width="639" height="463" rx="16" fill="#0a0b0e" stroke="#24262c"/>
  <text class="mono muted" x="34" y="56" font-size="16" letter-spacing="2">LANGUAGES  /  SHARE OF BYTES</text>
  
  <text class="mono ink" x="34" y="118" font-size="22">TypeScript</text>
  <rect x="204" y="107" width="316" height="8" rx="4" fill="#1a1c21"/>
  <rect class="bar" style="animation-delay:0ms" x="204" y="107" width="316" height="8" rx="4" fill="#f0a23b"/>
  <text class="mono soft" x="606" y="118" font-size="21" text-anchor="end">50.5%</text>
  <text class="mono ink" x="34" y="176" font-size="22">Shell</text>
  <rect x="204" y="165" width="316" height="8" rx="4" fill="#1a1c21"/>
  <rect class="bar" style="animation-delay:80ms" x="204" y="165" width="80.6" height="8" rx="4" fill="#f0a23b"/>
  <text class="mono soft" x="606" y="176" font-size="21" text-anchor="end">12.9%</text>
  <text class="mono ink" x="34" y="234" font-size="22">JavaScript</text>
  <rect x="204" y="223" width="316" height="8" rx="4" fill="#1a1c21"/>
  <rect class="bar" style="animation-delay:160ms" x="204" y="223" width="64.1" height="8" rx="4" fill="#f0a23b"/>
  <text class="mono soft" x="606" y="234" font-size="21" text-anchor="end">10.2%</text>
  <text class="mono ink" x="34" y="292" font-size="22">PowerShell</text>
  <rect x="204" y="281" width="316" height="8" rx="4" fill="#1a1c21"/>
  <rect class="bar" style="animation-delay:240ms" x="204" y="281" width="58.8" height="8" rx="4" fill="#f0a23b"/>
  <text class="mono soft" x="606" y="292" font-size="21" text-anchor="end">9.4%</text>
  <text class="mono ink" x="34" y="350" font-size="22">Dart</text>
  <rect x="204" y="339" width="316" height="8" rx="4" fill="#1a1c21"/>
  <rect class="bar" style="animation-delay:320ms" x="204" y="339" width="40.5" height="8" rx="4" fill="#f0a23b"/>
  <text class="mono soft" x="606" y="350" font-size="21" text-anchor="end">6.5%</text>
  <text class="mono ink" x="34" y="408" font-size="22">Python</text>
  <rect x="204" y="397" width="316" height="8" rx="4" fill="#1a1c21"/>
  <rect class="bar" style="animation-delay:400ms" x="204" y="397" width="37" height="8" rx="4" fill="#f0a23b"/>
  <text class="mono soft" x="606" y="408" font-size="21" text-anchor="end">5.9%</text>
</svg>
