<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 246" width="1200" height="246" role="img" aria-labelledby="t d">
  <title id="t">Languages across public repositories</title>
  <desc id="d">Share of code by bytes: TypeScript 54.9%, Shell 14.7%, JavaScript 10.1%, Dart 7.4%, Python 6.6%, CSS 2.9%.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .ink { fill: #1f2328; } .soft { fill: #4b535d; } .muted { fill: #656d76; }
    .accent { fill: #b35900; } .faint { fill: #d0d7de; }
    .frame { fill: none; stroke: #d0d7de; }
    .rule { stroke: #d0d7de; }
    .track { fill: #eaeef2; }
    .bar { fill: #b35900; transform-box: fill-box; transform-origin: 0 50%; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
  </style>
  <rect class="frame" x=".5" y=".5" width="1199" height="245" rx="14"/>
  <text class="mono muted" x="56" y="55" font-size="15" letter-spacing=".5">LANGUAGES  /  PUBLIC REPOSITORIES</text>
  <text class="mono muted" x="1144" y="55" font-size="15" letter-spacing=".5" text-anchor="end">SHARE OF BYTES</text>
  <text class="mono ink" x="56" y="103" font-size="16">TypeScript</text>
  <rect class="track" x="186" y="93" width="318" height="8" rx="4"/>
  <rect class="bar" style="animation-delay:0ms" x="186" y="93" width="318" height="8" rx="4"/>
  <text class="mono soft" x="568" y="103" font-size="15" text-anchor="end">54.9%</text>
  <text class="mono ink" x="56" y="147" font-size="16">Shell</text>
  <rect class="track" x="186" y="137" width="318" height="8" rx="4"/>
  <rect class="bar" style="animation-delay:70ms" x="186" y="137" width="85.2" height="8" rx="4"/>
  <text class="mono soft" x="568" y="147" font-size="15" text-anchor="end">14.7%</text>
  <text class="mono ink" x="56" y="191" font-size="16">JavaScript</text>
  <rect class="track" x="186" y="181" width="318" height="8" rx="4"/>
  <rect class="bar" style="animation-delay:140ms" x="186" y="181" width="58.3" height="8" rx="4"/>
  <text class="mono soft" x="568" y="191" font-size="15" text-anchor="end">10.1%</text>
  <text class="mono ink" x="632" y="103" font-size="16">Dart</text>
  <rect class="track" x="762" y="93" width="318" height="8" rx="4"/>
  <rect class="bar" style="animation-delay:210ms" x="762" y="93" width="42.8" height="8" rx="4"/>
  <text class="mono soft" x="1144" y="103" font-size="15" text-anchor="end">7.4%</text>
  <text class="mono ink" x="632" y="147" font-size="16">Python</text>
  <rect class="track" x="762" y="137" width="318" height="8" rx="4"/>
  <rect class="bar" style="animation-delay:280ms" x="762" y="137" width="38.4" height="8" rx="4"/>
  <text class="mono soft" x="1144" y="147" font-size="15" text-anchor="end">6.6%</text>
  <text class="mono ink" x="632" y="191" font-size="16">CSS</text>
  <rect class="track" x="762" y="181" width="318" height="8" rx="4"/>
  <rect class="bar" style="animation-delay:350ms" x="762" y="181" width="16.6" height="8" rx="4"/>
  <text class="mono soft" x="1144" y="191" font-size="15" text-anchor="end">2.9%</text>
</svg>
