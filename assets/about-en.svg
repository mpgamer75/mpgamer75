  <text class="mono amber in" x="80" y="100" font-size="13" letter-spacing="3">ABOUT</text>
  <text class="sans ink in" style="animation-delay:.15s" x="78" y="152" font-size="38" font-weight="700" letter-spacing="-1">I build software,</text>
  <text class="sans in" style="animation-delay:.3s" x="78" y="198" font-size="38" font-weight="700" letter-spacing="-1" fill="url(#wipe)">and the tools that test it.</text>
  <text class="sans soft in" style="animation-delay:0.5s" x="80" y="244" font-size="17">Most of what is public here is security tooling for the</text>
  <text class="sans soft in" style="animation-delay:0.5s" x="80" y="271" font-size="17">terminal: a recon framework mapped to MITRE ATT&amp;CK, an</text>
  <text class="sans soft in" style="animation-delay:0.6s" x="80" y="298" font-size="17">authenticated encryption toolkit on top of OpenSSL, and the</text>
  <text class="sans soft in" style="animation-delay:0.7s" x="80" y="325" font-size="17">automation I wrote for a SOC team. Alongside it I ship web</text>
  <text class="sans soft in" style="animation-delay:0.7s" x="80" y="352" font-size="17">and mobile products, and I co-founded Lanjo Technologies.</text>
