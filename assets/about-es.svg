  <text class="mono amber in" x="80" y="100" font-size="13" letter-spacing="3">SOBRE MI</text>
  <text class="sans ink in" style="animation-delay:.15s" x="78" y="152" font-size="38" font-weight="700" letter-spacing="-1">Construyo software,</text>
  <text class="sans in" style="animation-delay:.3s" x="78" y="198" font-size="38" font-weight="700" letter-spacing="-1" fill="url(#wipe)">y lo que lo pone a prueba.</text>
  <text class="sans soft in" style="animation-delay:0.5s" x="80" y="244" font-size="17">La mayor parte de lo que es público aquí son herramientas de</text>
  <text class="sans soft in" style="animation-delay:0.5s" x="80" y="271" font-size="17">seguridad para la terminal: un framework de reconocimiento</text>
  <text class="sans soft in" style="animation-delay:0.6s" x="80" y="298" font-size="17">alineado con MITRE ATT&amp;CK, un conjunto de herramientas de</text>
  <text class="sans soft in" style="animation-delay:0.7s" x="80" y="325" font-size="17">cifrado autenticado sobre OpenSSL, y la automatización que</text>
  <text class="sans soft in" style="animation-delay:0.7s" x="80" y="352" font-size="17">escribí para un equipo SOC. En paralelo entrego productos</text>
  <text class="sans soft in" style="animation-delay:0.8s" x="80" y="379" font-size="17">web y móviles, y cofundé Lanjo Technologies.</text>
