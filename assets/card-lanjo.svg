<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Lanjo Technologies</title>
  <desc id="d">Co-founder. Cybersecurity, IT infrastructure, web and custom software studio in Santiago de los Caballeros. Company site built with Next.js 16, React 19 and Tailwind v4.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .ink { fill: #f3efe8; } .soft { fill: #b9b3a8; } .muted { fill: #7d786f; }
    .amber { fill: #f0a23b; } .hot { fill: #ffcf85; } .faint { fill: #24262c; }
    .rule { stroke: #24262c; fill: none; }
    .sa { stroke: #f0a23b; fill: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes nudge { 50% { transform: translate(3px, -3px); } }
    .arrow { animation: nudge 2.4s ease-in-out infinite; }
    .wline { fill: none; stroke: #f0a23b; stroke-width: 1.6; stroke-dasharray: 620; stroke-dashoffset: 620; animation: wline 10s ease-in-out infinite; }
    .wfill { fill: #f0a23b; opacity: 0; animation: wfill 10s ease-in-out infinite; }
    .svc { fill: #7d786f; animation: svc 6s linear infinite; }
    @keyframes wline { 0% { stroke-dashoffset: 620; opacity: 1; } 35%, 82% { stroke-dashoffset: 0; opacity: 1; } 94%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes wfill { 0%, 30% { opacity: 0; } 45%, 82% { opacity: .16; } 94%, 100% { opacity: 0; } }
    @keyframes svc { 0%, 25%, 100% { fill: #7d786f; } 4%, 20% { fill: #ffcf85; } }
    @media (prefers-reduced-motion: reduce) { .wline { stroke-dashoffset: 0; } .wfill { opacity: .16; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#24262c"/></pattern>
    <linearGradient id="fadeE" x1="0" x2="1"><stop offset="0" stop-color="#0a0b0e"/><stop offset="1" stop-color="#0a0b0e" stop-opacity="0"/></linearGradient>
    <clipPath id="pr"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="1199" height="319" rx="16" fill="#0a0b0e" stroke="#24262c"/>
  <g clip-path="url(#pr)">
    <rect x="600" y="1" width="599" height="318" fill="url(#dots)"/>
    <rect x="600" y="1" width="240" height="318" fill="url(#fadeE)"/>
    <text class="sans wfill" x="1140" y="196" font-size="150" font-weight="800" letter-spacing="4" text-anchor="end">LANJO</text><text class="sans wline" x="1140" y="196" font-size="150" font-weight="800" letter-spacing="4" text-anchor="end">LANJO</text>
    <path class="rule" d="M700 222H1144"/>
    <text class="mono svc" style="animation-delay:0s" x="700" y="246" font-size="13" letter-spacing="2">CYBERSECURITY</text><text class="mono svc" style="animation-delay:1.5s" x="857.4" y="246" font-size="13" letter-spacing="2">IT INFRASTRUCTURE</text><text class="mono svc" style="animation-delay:3s" x="1054" y="246" font-size="13" letter-spacing="2">WEB</text><text class="mono svc" style="animation-delay:4.5s" x="1113.4" y="246" font-size="13" letter-spacing="2">SOFTWARE</text>
    <text class="mono muted" x="1144" y="282" font-size="12" letter-spacing="2" text-anchor="end">SANTIAGO DE LOS CABALLEROS  /  19.4517 N  70.6970 W</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="16" fill="none" stroke="#24262c"/>
  <text class="mono" x="56" y="62" font-size="13" letter-spacing="2" fill="#f0a23b">FEATURED  /  CO-FOUNDER</text>
  <text class="sans ink" x="54" y="112" font-size="40" font-weight="700" letter-spacing="-1">Lanjo Technologies</text>
  <text class="sans soft" x="56" y="150" font-size="17.5">The studio I co-founded in Santiago de los Caballeros:</text>
  <text class="sans soft" x="56" y="176" font-size="17.5">cybersecurity, IT infrastructure, web and custom software from</text>
  <text class="sans soft" x="56" y="202" font-size="17.5">one team that builds the technology and knows how to attack and</text>
  <text class="sans soft" x="56" y="228" font-size="17.5">defend it. I built the company site.</text>
  <rect x="56" y="254" width="111" height="29" rx="14.5" fill="none" stroke="#24262c"/><text class="mono soft" x="111.5" y="273.2" font-size="13.5" text-anchor="middle">Next.js 16</text><rect x="175" y="254" width="94" height="29" rx="14.5" fill="none" stroke="#24262c"/><text class="mono soft" x="222" y="273.2" font-size="13.5" text-anchor="middle">React 19</text><rect x="277" y="254" width="119" height="29" rx="14.5" fill="none" stroke="#24262c"/><text class="mono soft" x="336.5" y="273.2" font-size="13.5" text-anchor="middle">Tailwind v4</text>
  <path class="arrow" fill="none" stroke="#f0a23b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M416 277L434 259M420 259H434V273"/>
</svg>
