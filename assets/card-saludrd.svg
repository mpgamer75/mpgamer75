<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Mi SaludRD</title>
  <desc id="d">Digital health platform for the Dominican Republic, built and operated by Lanjo Technologies. Next.js, Flutter, Supabase, Stripe.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .ink { fill: #f3efe8; } .soft { fill: #b9b3a8; } .muted { fill: #7d786f; }
    .amber { fill: #f0a23b; } .hot { fill: #ffcf85; } .faint { fill: #24262c; }
    .rule { stroke: #24262c; fill: none; }
    .sa { stroke: #f0a23b; fill: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .ecg { stroke-dasharray: .22 .78; animation: ecg 3.2s linear infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite; }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
    .arrow { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes ecg { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
    @keyframes beat { 0%, 30%, 100% { transform: scale(1); } 12% { transform: scale(1.08); } 22% { transform: scale(.98); } }
    @keyframes nudge { 50% { transform: translate(3px, -3px); } }
    @media (prefers-reduced-motion: reduce) { .ecg { stroke-dasharray: none; } .ring { display: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="pr"><rect width="1200" height="320" rx="16"/></clipPath>
    <radialGradient id="halo"><stop offset="0" stop-color="#4fd1d9" stop-opacity=".22"/><stop offset="1" stop-color="#4fd1d9" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x=".5" y=".5" width="1199" height="319" rx="16" fill="#0a0b0e" stroke="#24262c"/><rect x=".5" y=".5" width="1199" height="319" rx="16" fill="none" stroke-linecap="round" stroke="#f0a23b" stroke-width="5" opacity=".16" stroke-dasharray="211 2802"><animate attributeName="stroke-dashoffset" from="3013" to="0" dur="10s" repeatCount="indefinite"/></rect><rect x=".5" y=".5" width="1199" height="319" rx="16" fill="none" stroke-linecap="round" stroke="#ffcf85" stroke-width="1.4" stroke-dasharray="211 2802"><animate attributeName="stroke-dashoffset" from="3013" to="0" dur="10s" repeatCount="indefinite"/></rect>
  <g clip-path="url(#pr)">
    <circle cx="930" cy="150" r="170" fill="url(#halo)"/>
    <path d="M640 150H742l10 -8 10 8h20l8 16 12 -70 14 96 10 -42h22M1012 150h20l8 16 12 -70 14 96 10 -42h22l10 -8 10 8H1144" fill="none" stroke="#24262c" stroke-width="1.5" stroke-linejoin="round"/>
    <path class="ecg" pathLength="1" d="M640 150H742l10 -8 10 8h20l8 16 12 -70 14 96 10 -42h22M1012 150h20l8 16 12 -70 14 96 10 -42h22l10 -8 10 8H1144" fill="none" stroke="#4fd1d9" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="ring" cx="930" cy="150" r="62" fill="none" stroke="#4fd1d9" stroke-width="1.5"/>
    <circle class="ring" style="animation-delay:1.5s" cx="930" cy="150" r="62" fill="none" stroke="#2f7fd6" stroke-width="1.5"/>
    <circle cx="930" cy="150" r="62" fill="#0d1218" stroke="#24262c"/>
    <image class="beat" x="864" y="84" width="132" height="132" xlink:href="data:image/png;base64," href="data:image/png;base64,"/>
    <text class="mono muted" x="1144" y="282" font-size="12" letter-spacing="2" text-anchor="end">MI-SALUDRD.COM  /  REPUBLICA DOMINICANA</text>
  </g>
  <text class="mono" x="56" y="62" font-size="13" letter-spacing="2" fill="#4fd1d9">PRODUCT  /  LANJO TECHNOLOGIES</text>
  <text class="sans ink" x="54" y="112" font-size="40" font-weight="700" letter-spacing="-1">Mi SaludRD</text>
  <text class="sans soft" x="56" y="150" font-size="17.5">Lanjo's own product, in beta: a digital health platform for the</text>
  <text class="sans soft" x="56" y="176" font-size="17.5">Dominican Republic. Patients book appointments with verified</text>
  <text class="sans soft" x="56" y="202" font-size="17.5">professionals; doctors get scheduling, clinical records and</text>
  <text class="sans soft" x="56" y="228" font-size="17.5">modules per specialty.</text>
  <rect x="56" y="254" width="88" height="30" rx="15" fill="none" stroke="#24262c"/><text class="mono soft" x="100" y="274" font-size="13.5" text-anchor="middle">Next.js</text><rect x="152" y="254" width="88" height="30" rx="15" fill="none" stroke="#24262c"/><text class="mono soft" x="196" y="274" font-size="13.5" text-anchor="middle">Flutter</text><rect x="248" y="254" width="97" height="30" rx="15" fill="none" stroke="#24262c"/><text class="mono soft" x="296.5" y="274" font-size="13.5" text-anchor="middle">Supabase</text><rect x="353" y="254" width="80" height="30" rx="15" fill="none" stroke="#24262c"/><text class="mono soft" x="393" y="274" font-size="13.5" text-anchor="middle">Stripe</text>
  <path class="arrow" fill="none" stroke="#4fd1d9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M455 278L473 260M459 260H473V274"/>
</svg>
